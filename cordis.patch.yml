- id: speech-to-text
  config:
    defaultProvider: gigaam-local
    language: ru
- id: speech-to-text-sensevoice
  disabled: true
# The harness ships 120 s / 4 MiB recording caps; raise them so a long dictation is not silently cut.
- id: api-speech-to-text
  config:
    maxAudioBytes: 20971520
    maxDurationSeconds: 600
- insert:
    - id: speech-to-text-gigaam
      name: dsh-gigaam-stt
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'gigaam')
